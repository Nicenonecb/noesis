[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "noesis"
version = "0.1.0"
description = "NOESIS · 智穹 — local-first personal activity collection"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
noesis = "noesis.cli:main"

[tool.setuptools.packages.find]
include = ["noesis*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
