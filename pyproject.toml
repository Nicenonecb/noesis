[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-brain"
version = "0.1.0"
description = "Local-first personal activity collection"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
aibrain = "aibrain.cli:main"

[tool.setuptools.packages.find]
include = ["aibrain*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
